name: catalog health

# Weekly: one pull request that follows moved repos and marks deleted or archived ones with a
# `status` (shown as ⚠️ on the site). Removing an entry stays a human decision, made in review.
on:
  schedule:
    - cron: '23 6 * * 3' # weekly, Wednesday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/health.mjs
      - run: npm run validate
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: health/automated
          delete-branch: true
          add-paths: |
            scripts/**
            site.config.json
          commit-message: 'scripts: catalog health'
          title: 'scripts: catalog health'
          body-path: health.md
          labels: health
