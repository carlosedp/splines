name: build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily refresh of stars / last-push data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore GitHub metadata cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: gh-meta-${{ github.run_id }}
          restore-keys: gh-meta-
      - name: Enrich with GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # read-only key for the forum: maps script pages to their topics (likes still update without it)
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
        run: npm run enrich
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
