name: build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily refresh of stars / last-push data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the admin-data branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore GitHub metadata cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: gh-meta-${{ github.run_id }}
          restore-keys: gh-meta-
      - name: Enrich with GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # read-only key for the forum: maps script pages to their topics (likes still update without it)
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
        run: npm run enrich
      - run: npm run validate
      - run: npm run build
      # The admin view's index of unpublished entries (tools/admin-index.mjs). It goes to its own branch, one commit,
      # force-pushed, so it stays off the site: splines.cc only ever serves published entries.
      - name: Publish the admin index to the admin-data branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run admin-index
          cd admin-data
          git init -q -b admin-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add unpublished.json
          git commit -q -m "admin index for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:admin-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
