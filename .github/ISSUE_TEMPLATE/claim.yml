# Field labels are read by tools/from-issue.mjs: keep them in sync when renaming.
# Invitations (tools/invite.mjs) link here with `script` filled in.
name: Claim and publish your script
description: Your script is in the catalog but not on the site yet, or was imported automatically? Opt in, disclose AI use and fix its details.
title: "[claim] "
labels: [claim]
body:
  - type: markdown
    attributes:
      value: |
        Scripts only go on splines with their author's OK. Send this form to publish yours (or, if it's already listed, to claim it). A bot turns it into a pull request; leave a field empty to keep what's there.
        Changed your mind, or don't want it listed? Use the [opt-out form](https://github.com/carlosedp/splines/issues/new?template=optout.yml&title=%5Boptout%5D%20) instead.
  - type: input
    id: script
    attributes:
      label: Script
      description: Its name in the catalog, or a link to its page.
      placeholder: https://splines.cc/scripts/my-script/
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI disclosure
      description: Required. See https://splines.cc/about/#ai-disclosure
      options:
        - "none: written without AI code generation (autocomplete-level help is fine)"
        - "assisted: made with meaningful help from AI tools, reviewed and tested by me"
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: Optional. One line, 160 characters max.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional. Replaces the current tags; separate with commas.
  - type: input
    id: requires
    attributes:
      label: Hardware it needs
      description: Optional. Replaces the current list; separate with commas (grid, arc, crow, midi, audio-in, keyboard, jf, ansible, teletype, hid, osc, txo, er-301).
  - type: input
    id: author
    attributes:
      label: Author
      description: Optional. How you'd like to be credited.
  - type: checkboxes
    id: confirm
    attributes:
      label: The one rule
      options:
        - label: I'm the author of this script, and I'd like it listed on splines
          required: true
        - label: I understand the code well enough to answer questions and fix bugs
          required: true
